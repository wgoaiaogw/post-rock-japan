<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会場｜POSTROCK JAPAN</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">POSTROCK <span>JAPAN</span></a>
  <div class="tag">日本のポストロック公演情報（公式情報源ベース）</div>
  <nav class="main">
    <a href="index.html">公演一覧</a>
    <a href="artists.html">アーティスト</a>
    <a href="venues.html">会場</a>
  </nav>
</header>
<main id="main"><p class="empty">読み込み中…</p></main>
<footer class="site">POSTROCK JAPAN — 公演情報は各公式発表に基づきます。最新情報は公式サイトでご確認ください。</footer>
<script src="assets/app.js"></script>
<script>
loadDB().then(() => {
  const v = venueById(qs.get('id'));
  const el = document.getElementById('main');
  if (!v) { el.innerHTML = '<p class="empty">会場が見つかりませんでした。</p>'; return; }
  document.title = v.name + '｜POSTROCK JAPAN';
  const rows = [
    ['住所', esc(v.address || '—')],
    ['アクセス', esc(v.access || '—')],
    ['キャパ', esc(v.capacity || '—')],
    v.official_url ? ['WEB', `<a href="${esc(v.official_url)}" target="_blank" rel="noopener">${esc(v.official_url)}</a>`] : null
  ].filter(Boolean).map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('');
  el.innerHTML = `
    <h1>${esc(v.name)}</h1>
    <div class="sub">${esc(v.area || '')}</div>
    <table class="info">${rows}</table>
    <h2 style="font-size:17px">この会場の今後の公演</h2>
    <div id="evlist"></div>`;
  renderEventList(document.getElementById('evlist'), upcomingEvents(ev => ev.venue_id === v.id));
});
</script>
</body>
</html>
