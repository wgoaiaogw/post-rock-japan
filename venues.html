<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会場一覧｜POSTROCK JAPAN</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">POSTROCK <span>JAPAN</span></a>
  <div class="tag">日本のポストロック公演情報（公式情報源ベース）</div>
  <nav class="main">
    <a href="index.html">公演一覧</a>
    <a href="artists.html">アーティスト</a>
    <a href="venues.html">会場</a>
  </nav>
</header>
<main id="main"><p class="empty">読み込み中…</p></main>
<footer class="site">POSTROCK JAPAN — 公演情報は各公式発表に基づきます。最新情報は公式サイトでご確認ください。</footer>
<script src="assets/app.js"></script>
<script>
loadDB().then(() => {
  const el = document.getElementById('main');
  const items = [...DB.venues].sort((a, b) => (a.area + a.name).localeCompare(b.area + b.name)).map(v => {
    const n = upcomingEvents(ev => ev.venue_id === v.id).length;
    return `<li><a href="venue.html?id=${encodeURIComponent(v.id)}">${esc(v.name)}</a>
      <span class="sub">${esc(v.area || '')}${v.capacity ? ' ／ キャパ ' + esc(v.capacity) : ''} ／ 今後の公演 ${n} 件</span></li>`;
  }).join('');
  el.innerHTML = `<h1>会場一覧</h1><ul class="list-simple">${items || '<li class="empty">まだ登録がありません。</li>'}</ul>`;
});
</script>
</body>
</html>
