<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公演詳細｜POSTROCK JAPAN</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="index.html">POSTROCK <span>JAPAN</span></a>
  <div class="tag">日本のポストロック公演情報（公式情報源ベース）</div>
  <nav class="main">
    <a href="index.html">公演一覧</a>
    <a href="artists.html">アーティスト</a>
    <a href="venues.html">会場</a>
  </nav>
</header>
<main id="main"><p class="empty">読み込み中…</p></main>
<footer class="site">POSTROCK JAPAN — 公演情報は各公式発表に基づきます。最新情報は公式サイトでご確認ください。</footer>
<script src="assets/app.js"></script>
<script>
loadDB().then(() => {
  const ev = DB.events.find(e => e.id === qs.get('id'));
  const el = document.getElementById('main');
  if (!ev) { el.innerHTML = '<p class="empty">公演が見つかりませんでした。</p>'; return; }
  const v = venueById(ev.venue_id);
  const d = new Date(ev.date + 'T00:00:00');
  const wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  document.title = ev.title + '｜POSTROCK JAPAN';
  const rows = [
    ['日時', `${ev.date}（${wd}）　OPEN ${esc(ev.open || '—')} / START ${esc(ev.start || '—')}`],
    ['出演', artistLinks(ev)],
    ['ジャンル', (ev.genre_tags || []).join(' / ')],
    ['会場', v ? `<a href="venue.html?id=${encodeURIComponent(v.id)}">${esc(v.name)}</a>（${esc(v.area)}）` : '—'],
    ['料金', `前売 ${yen(ev.price_adv)}${ev.price_door != null ? ` / 当日 ${yen(ev.price_door)}` : ''}${ev.drink_note ? `　※${esc(ev.drink_note)}` : ''}`],
    ev.organizer ? ['主催', esc(ev.organizer)] : null,
    ev.note ? ['備考', esc(ev.note)] : null
  ].filter(Boolean).map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('');
  el.innerHTML = `
    <h1>${esc(ev.title)}</h1>
    <div class="sub">${ev.date}（${wd}） ${v ? '＠ ' + esc(v.name) : ''}</div>
    <table class="info">${rows}</table>
    <div class="card">
      <div>チケット：${ev.ticket_status ? `<span class="badge ${badgeClass(ev.ticket_status)}">${esc(ev.ticket_status)}</span>` : '—'}</div>
      ${ev.ticket_info ? `<div class="sub" style="margin-top:6px">${esc(ev.ticket_info)}</div>` : ''}
      <div style="margin-top:12px">${ev.ticket_url ? `<a class="btn" href="${esc(ev.ticket_url)}" target="_blank" rel="noopener">チケットを買う / 詳細</a>` : ''}</div>
    </div>
    ${v ? `<div class="card"><strong>会場</strong><br><a href="venue.html?id=${encodeURIComponent(v.id)}">${esc(v.name)}</a><br>
      <span class="sub">${esc(v.address || '')}${v.access ? '／' + esc(v.access) : ''}${v.capacity ? '／キャパ ' + esc(v.capacity) : ''}</span></div>` : ''}
    <div class="src">情報源：${ev.source_url ? `<a href="${esc(ev.source_url)}" target="_blank" rel="noopener">${esc(ev.source_url)}</a>` : '—'}（確認日：${esc(ev.checked_date || '—')}）
    ${ev.official_url ? `<br>公式：<a href="${esc(ev.official_url)}" target="_blank" rel="noopener">${esc(ev.official_url)}</a>` : ''}</div>`;
});
</script>
</body>
</html>
